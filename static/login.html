<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrabFarm Co. — Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <span class="login-logo">🦀</span>
        <h1>Admin Control</h1>
        <p>Log in to manage inventory, orders & site settings.</p>
      </div>
      
      <div class="alert-danger" id="loginAlert"></div>
      
      <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login" id="loginBtn">Log In</button>
      </form>
      
      <div class="login-footer">
        <a href="/">← Return to Store</a>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
